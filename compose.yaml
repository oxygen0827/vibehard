services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: vibehard
      POSTGRES_USER: vibehard
      POSTGRES_PASSWORD: vibehard
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - vibehard-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibehard -d vibehard"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  vibehard-postgres:
